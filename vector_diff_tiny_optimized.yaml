# Configuration for optimized tiny VectorDiffusion model
root: "./data"
dataset: "CHILI-3K"
graph_type: "central"  # Use central atoms graph type for consistent 100-atom structures
task: "AbsPositionRegressionxPDF"
model: "VectorDiffusion"
log_dir: "./logs"
save_latest_model: true  # Save the latest model during training
custom_loss: true  # Flag to indicate that the model uses its own loss function

# Model configuration - optimized tiny size
Model_config:
  in_channels: 6000  # xPDF data has shape [2, 6000], we only use the 6000 y-values
  hidden_channels: 40  # Slightly increased from 32 for better capacity while still small
  out_channels: 300  # Maximum 100 atoms, each with 3 coordinates
  T: 30  # Slightly increased diffusion steps for better quality
  beta_1: 0.0001
  beta_T: 0.015  # Reduced slightly for smoother diffusion

# Training configuration
Train_config:
  batch_size: 48  # Balanced batch size
  learning_rate: 0.0004  # Slightly reduced learning rate for more stable training
  lr_scheduler: true  # Enable learning rate scheduler
  lr_step_size: 75  # Less frequent learning rate changes
  lr_gamma: 0.7  # Less aggressive reduction
  epochs: 750  # Extended epoch count to see full potential
  train_time: 172800  # 48 hours in seconds - double the time
  max_patience: 9999  # Effectively disable early stopping
  seeds: [42]  # Single seed for one thorough run
  weight_decay: 0.00005  # Reduced weight decay for less regularization 