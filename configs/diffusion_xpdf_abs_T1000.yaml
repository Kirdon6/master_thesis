# Configuration file for VectorDiffusion model on xPDF task with absolute positions and many diffusion steps
model: "Diffusion"
task: "AbsPositionRegressionXPDF"

# Dataset information
dataset:
  root: "data"
  name: "CHILI-3K"
  graph_type: "central"

# Output and logging settings
log_dir: "logs"
output_dir: "diffusion_results"
generate_samples: true

# Model parameters
Model_config:
  model_type: "pos_abs"  # Absolute positions
  T: 1000                # Number of diffusion steps
  cond_dim: 6000         # Dimensionality of xPDF data
  cond_embed_dim: 64     # Embedding dimension for conditioning
  image_size: [10, 10]   # Image size (height, width)
  cond_type: "xPDF"      # Conditioning type
  atom_mapping_path: 'atom_type_mapping.json'

# Training parameters
Train_config:
  batch_size: 64
  learning_rate: 0.0001
  epochs: 100
  ema: true              # Use Exponential Moving Average
  seed: 42
  num_workers: 0 