# Configuration for VectorDiffusion model with extended training
root: "./data"
dataset: "CHILI100k"  # Using larger dataset with 100k structures
graph_type: "central"  # Use central atoms graph type for consistent 100-atom structures
task: "AbsPositionRegressionxPDF"
model: "VectorDiffusion"
log_dir: "./logs"
save_latest_model: true  # Save the latest model during training
custom_loss: true  # Flag to indicate that the model uses its own loss function

# Model configuration - appropriate size for larger dataset
Model_config:
  in_channels: 6000  # xPDF data has shape [2, 6000], we only use the 6000 y-values
  hidden_channels: 128  # Moderate size for balance of capacity and trainability
  out_channels: 300  # Maximum 100 atoms, each with 3 coordinates
  T: 100  # Standard number of diffusion steps
  beta_1: 0.0001
  beta_T: 0.02

# Training configuration
Train_config:
  batch_size: 64  # Larger batch size for more stable gradients
  learning_rate: 0.0003  # Slightly higher initial learning rate
  lr_scheduler: true  # Enable learning rate scheduler
  lr_step_size: 50  # Reduce learning rate every 50 epochs
  lr_gamma: 0.7  # Reduce learning rate by 30% each step
  epochs: 300  # Extended training length
  train_time: 259200  # 72 hours in seconds - increased time for longer training
  max_patience: 40  # Much higher patience to allow for gradual improvements
  seeds: [42]  # Single seed is often sufficient with larger datasets
  weight_decay: 0.00005  # Light regularization 