# Configuration for smaller VectorDiffusion model
root: "./data"
dataset: "CHILI-3K"
graph_type: "central"  # Use central atoms graph type for consistent 100-atom structures
task: "AbsPositionRegressionxPDF"
model: "VectorDiffusion"
log_dir: "./logs"
save_latest_model: true  # Save the latest model during training
custom_loss: true  # Flag to indicate that the model uses its own loss function

# Enable Reporter for diffusion visualization
use_reporter: true

# Reporter configuration
Reporter_config:
  visualization_period: 25 # Visualize every 10 epochs
  timesteps_to_visualize: [0,25, 50]  # Timesteps to visualize in the diffusion process
  num_structures: 1  # Number of structures to visualize
  figsize: [15, 8]  # Figure size (width, height) in inches

# Model configuration - significantly reduced size
Model_config:
  in_channels: 6000  # xPDF data has shape [2, 6000], we only use the 6000 y-values
  hidden_channels: 64  # Reduced from 256 to 64 (75% reduction)
  out_channels: 300  # Maximum 100 atoms, each with 3 coordinates
  T: 50  # Reduced number of diffusion steps from 100 to 50
  beta_1: 0.0001
  beta_T: 0.02

# Training configuration
Train_config:
  batch_size: 32  # Increased batch size for more stable gradients
  learning_rate: 0.0003  # Slightly higher learning rate
  lr_scheduler: true  # Enable learning rate scheduler
  lr_step_size: 40  # Reduce learning rate every 40 epochs
  lr_gamma: 0.7  # Reduce learning rate by 30% each step
  epochs: 200  # More epochs to ensure convergence opportunity
  train_time: 86400  # 24 hours in seconds
  max_patience: 30  # Increased patience
  seeds: [42, 43, 44]
  weight_decay: 0.0001  # Added weight decay for regularization 